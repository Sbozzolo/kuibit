[tool.poetry]
name = "kuibit"
version = "1.6.0"
description = "Read and analyze Einstein Toolkit simulations."
authors = ["Gabriele Bozzola <gbozzola@caltech.edu>"]
maintainers = ["Gabriele Bozzola <gbozzola@caltech.edu>"]
license = "GPL-3.0-or-later"
readme = "README.md"
homepage = "https://github.com/sbozzolo/kuibit"
repository = "https://github.com/sbozzolo/kuibit"
documentation = "https://sbozzolo.github.io/kuibit"

[tool.poetry.urls]
"Bug Tracker" = "https://github.com/sbozzolo/kuibit/issues"

[tool.poetry.dependencies]
python = ">=3.9,<3.15"

numpy = ">=1.26,<3"
scipy = ">=1.11"
h5py = "^3.2.0"
numba = { version = ">=0.59, <1", optional = true }
ConfigArgParse = "^1.2.3"
matplotlib = "^3.5.0"
motionpicture = ">=0.2.0, ^0"
argcomplete = "^2.0.0"
tikzplotlib = ">=0.9.13, ^0"
py-expression-eval = ">=0.3.14, ^0"
openpmd-api = [
  { version = "^0.15.2", python = "<3.12" },
  { version = "^0.16.0", python = ">=3.12,<3.14" },
  { version = "^0.17.0", python = ">=3.14" }
]

[tool.poetry.group.dev.dependencies]
black = "^24.1.0"
cffi = "^1.17.1"
coverage = "^7.0"
setuptools = "^69.0.0"
Sphinx = "^7.0"
jupyter = "^1.0.0"
jedi = ">=0.18.1, ^0"
snakeviz = "^2.1.0"
nbsphinx = ">0.8.10, ^0"
isort = "^5.13.0"
flake8 = "^6.0.0"
mypy = ">=0.931, ^0"
sphinx-autodoc-typehints = "^1.17.0"
sphinxcontrib-citations = ">=0.1.1, ^0"

[tool.poetry.extras]
full = ["numba"]

[tool.black]
line-length = 79
exclude = '''
/(
    \.git
  | docs
)/
'''

[tool.isort]
line_length = 79
profile = "black"
multi_line_output = 3

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
