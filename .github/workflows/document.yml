name: Document

on: [push, pull_request]

jobs:

  Document:
    runs-on:
        ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.13
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: 3.13

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 1.8.5
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Load cached Poetry virtualenv
        uses: actions/cache@v4
        id: cached-poetry-dependencies
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('**/poetry.lock') }}

      - name: Install Dependencies
        run: |
          poetry install --with dev -E full
        if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'

      - name: Clone gh-pages
        run: |
          git clone https://github.com/sbozzolo/kuibit.git --branch gh-pages --single-branch gh-pages

      # Build the "Versions" sidebar list from the version directories that
      # actually exist on gh-pages, keeping only the latest patch release of each
      # minor series. This guarantees every link in the sidebar points to a
      # directory that exists, and keeps the master/dev docs in sync with the
      # released versions.
      - name: Compute versions list
        run: |
          VERSIONS=$( ls -1 gh-pages 2>/dev/null \
            | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' \
            | sort -V \
            | awk -F. '{ latest[$1"."$2] = $0 } END { for (k in latest) print latest[k] }' \
            | sort -V \
            | paste -sd, - )
          echo "Versions for sidebar: $VERSIONS"
          echo "KUIBIT_DOC_VERSIONS=$VERSIONS" >> "$GITHUB_ENV"

      - name: Produce documentation
        env:
            ADS_API: ${{ secrets.ADS_API }}
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc
          cd docs/
          poetry run make html
          cd ..

      - name: Commit documentation changes
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p gh-pages/dev
          [[ $(git branch --show-current) == 'next' ]] && cp -r docs/_build/html/* gh-pages/dev/ || cp -r docs/_build/html/* gh-pages/
          cd gh-pages
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add .
          git commit -m "Update documentation" -a || true
          # The above command will fail if no changes were present, so we ignore
          # the return code.

      - name: Push changes
        if: github.event_name != 'pull_request'
        uses: ad-m/github-push-action@master
        with:
          branch: gh-pages
          # force: true
          directory: gh-pages
          github_token: ${{ secrets.GITHUB_TOKEN }}
